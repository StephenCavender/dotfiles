# Global pip config. Symlinked to ~/.config/pip/pip.conf by supply-chain/install.sh.
#
# Refuse to install any distribution uploaded less than 3 days ago. Same
# rationale as the npm/pnpm/bun cooldowns — see supply-chain/install.sh.
# Requires pip 26.1+ (uploaded-prior-to accepts an ISO 8601 duration).
#
# Deliberately under [global], not [install]: an [install]-scoped key is honoured
# by `pip install` but silently ignored by `pip download` and `pip wheel`, which
# resolve versions too. [global] covers every subcommand.
#
# Override for a single install:
#   pip install --uploaded-prior-to 2026-01-01T00:00:00Z <pkg>

[global]
uploaded-prior-to = P3D
