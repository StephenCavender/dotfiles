# Global bun config. Symlinked to ~/.bunfig.toml by supply-chain/install.sh.
#
# Refuse to resolve any package version published less than 3 days ago.
# Compromised releases are usually yanked within hours, so a cooldown filters
# most supply-chain incidents at the install layer. Requires bun 1.3+.
#
# Project-level bunfig.toml overrides this — a global value is not a backstop
# for repos that set their own.

[install]
minimumReleaseAge = 259200  # 3 days, in seconds

# Packages allowed to bypass the gate. Add sparingly — every entry is a hole.
minimumReleaseAgeExcludes = []
